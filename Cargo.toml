[package]
name = "rocket_tycoon"
version = "0.1.0"
edition = "2021"
description = "A terminal game about running a rocket company"
repository = "https://github.com/aclough/rocket_game"
license = "MIT"
readme = "README.md"

[dependencies]
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "rocket_tycoon"
path = "src/bin/main.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"
